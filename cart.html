<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Navigation -->

    <nav>

        <h1>Mini Amazon</h1>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

        </div>

    </nav>


    <!-- Cart -->

    <div class="cart-container">

        <h2>Your Shopping Cart</h2>

        <div id="cartItems"></div>

        <h2 id="total"></h2>

    </div>


    <script>

        // Get cart from localStorage

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        let cartContainer =
            document.getElementById("cartItems");


        let total = 0;


        // Display cart items

        cart.forEach((product, index) => {

            total += product.price;

            cartContainer.innerHTML += `

                <div class="cart-item">

                    <div>

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            ₹${product.price}
                        </p>

                    </div>

                    <button onclick="removeItem(${index})">
                        Remove
                    </button>

                </div>

            `;

        });


        // Display total

        document.getElementById("total").innerHTML =
            "Total: ₹" + total;


        // Remove item

        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            location.reload();

        }

    </script>

</body>

</html>
